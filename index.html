<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Gerenciador de Tarefas</h1>
      <p>Aplicação-alvo do experimento do TCC</p>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <div>
        <h2>Tarefas</h2>
        <p>Cadastre, consulte, edite, conclua e exclua tarefas.</p>
      </div>
      <a id="botao-nova-tarefa" class="button primary" href="nova.html">+ Nova tarefa</a>
    </section>

    <div id="mensagem" class="message hidden" role="status"></div>

    <section class="card">
      <div id="carregando" class="loading">Carregando tarefas...</div>

      <div id="estado-vazio" class="empty-state hidden">
        <h3>Nenhuma tarefa cadastrada</h3>
        <p>Cadastre a primeira tarefa para iniciar.</p>
      </div>

      <div class="table-wrapper">
        <table id="tabela-tarefas" class="task-table hidden">
          <thead>
            <tr>
              <th>Título</th>
              <th>Status</th>
              <th>Data de criação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-tarefas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
