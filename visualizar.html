<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar tarefa | Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Gerenciador de Tarefas</h1>
      <p>Consulta de tarefa</p>
    </div>
  </header>

  <main class="container narrow">
    <a class="back-link" href="index.html">← Voltar para a listagem</a>

    <section class="card">
      <div id="mensagem" class="message hidden" role="alert"></div>
      <div id="carregando" class="loading">Carregando tarefa...</div>

      <div id="detalhes-tarefa" class="hidden">
        <div class="detail-row">
          <span class="detail-label">Título</span>
          <strong id="detalhe-titulo"></strong>
        </div>
        <div class="detail-row">
          <span class="detail-label">Descrição</span>
          <p id="detalhe-descricao"></p>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span id="detalhe-status" class="status-badge"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Criado por</span>
          <span id="detalhe-criado-por"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Data de criação</span>
          <span id="detalhe-data"></span>
        </div>

        <div class="form-actions">
          <a id="editar-tarefa" class="button primary" href="#">Editar</a>
          <a class="button secondary" href="index.html">Voltar</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/common.js"></script>
  <script src="js/visualizar.js"></script>
</body>
</html>
